<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">티벗 앱 설치와 방송 퀴즈 참여 안내</title>
  <desc id="desc">아침마당, 생생정보, 무엇이든 물어보세요 티벗 퀴즈 안내</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effcf7"/><stop offset="1" stop-color="#e5f0ff"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00b96b"/><stop offset="1" stop-color="#0878ee"/></linearGradient></defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1030" cy="115" r="180" fill="#fff" opacity=".62"/><circle cx="1110" cy="515" r="230" fill="#d5e7ff" opacity=".5"/>
  <rect x="86" y="88" width="180" height="180" rx="42" fill="url(#card)"/>
  <path d="M131 132h90v62c0 38-27 63-45 74-18-11-45-36-45-74z" fill="#fff" opacity=".96"/>
  <path d="M153 160h47M153 184h47M153 208h31" stroke="#0878ee" stroke-width="12" stroke-linecap="round"/>
  <text x="86" y="350" font-family="Arial,'Malgun Gothic',sans-serif" font-size="64" font-weight="700" fill="#10253f">티벗 앱 설치·가입</text>
  <text x="86" y="425" font-family="Arial,'Malgun Gothic',sans-serif" font-size="46" font-weight="700" fill="#0878ee">아침마당 · 생생정보 퀴즈 참여</text>
  <text x="90" y="500" font-family="Arial,'Malgun Gothic',sans-serif" font-size="28" fill="#49627d">무엇이든 물어보세요 티벗 안내까지 한눈에 확인하세요</text>
