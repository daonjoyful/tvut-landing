name: Publish verified review

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/review-inbox/*.json'
      - 'scripts/build-review.mjs'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate review pages
        shell: bash
        run: |
          shopt -s nullglob
          files=(content/review-inbox/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No review input found"; exit 0; fi
          for file in "${files[@]}"; do node scripts/build-review.mjs "$file"; done
      - name: Commit generated reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated-reviews
          git diff --cached --quiet || git commit -m "Publish verified broadcast review"
          git push

