name: Publish verified review

on:
  workflow_dispatch:
  push:
    paths:
      - 'content/review-inbox/*.json'
      - 'scripts/build-review.mjs'
      - 'review.css'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate review pages
        shell: bash
        run: |
          shopt -s nullglob
          rm -f content/review-inbox/transcript-segment-*.json
          files=(content/review-inbox/transcript-*.json)
          files=("${files[@]}")
          if [ ${#files[@]} -eq 0 ]; then echo "No review input found"; exit 0; fi
          for file in "${files[@]}"; do node scripts/split-reallive-transcript.mjs "$file"; done
          segment_files=(content/review-inbox/transcript-segment-*.json)
          if [ ${#segment_files[@]} -gt 0 ]; then files=("${segment_files[@]}"); fi
          for file in "${files[@]}"; do node scripts/summarize-review.mjs "$file"; node scripts/validate-review-input.mjs "$file"; node scripts/build-review.mjs "$file"; done
      - name: Commit generated reviews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review
          git diff --cached --quiet || git commit -m "Publish verified broadcast review"
          git push
