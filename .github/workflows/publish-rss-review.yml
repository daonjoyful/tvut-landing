name: Publish latest KBS review pages

on:
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect latest official KBS videos
        run: node scripts/kbs-life-feed.mjs > kbs-review-candidates.json
      - name: Create review inputs
        run: node scripts/create-review-inputs.mjs kbs-review-candidates.json
      - name: Generate review pages
        shell: bash
        run: |
          shopt -s nullglob
          for file in content/review-inbox/auto-*.json; do node scripts/build-review.mjs "$file"; done
      - name: Commit new review pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/review-inbox/auto-*.json content/generated-reviews kbs-review-candidates.json
          git diff --cached --quiet || git commit -m "Publish latest KBS review information"
          git push

