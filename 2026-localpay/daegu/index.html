<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대구로페이 신청·충전·사용처 안내</title><style>body{margin:0;background:#eef3f8;color:#142b49;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:760px;margin:auto;background:white;padding:32px 24px;min-height:100vh}h1{font-size:32px;line-height:1.4}h2{border-left:4px solid #1768c7;padding-left:12px;margin-top:32px}p{line-height:1.9;color:#53657b}.btn{display:block;background:#1768c7;color:white;text-align:center;text-decoration:none;padding:16px;border-radius:10px;box-shadow:0 4px #0b4389;font-weight:bold;margin:18px 0}</style><main class="wrap"><small>대구 지역사랑상품권</small><h1>대구로페이 신청·충전·사용처 안내</h1><p>대구로페이는 대구 지역에서 사용하는 지역화폐입니다. 발급 형태와 할인 혜택, 충전 일정은 대구시와 운영기관의 최신 안내를 기준으로 확인하세요.</p><a class="btn" href="https://daeguro.co.kr/" target="_blank" rel="noreferrer">대구로페이 공식 안내 확인 ↗</a><h2>신청·충전 방법</h2><p>공식 앱 또는 지정 채널에서 본인인증을 하고 카드 발급과 충전을 진행합니다. 판매 기간과 구매 한도는 예산에 따라 달라질 수 있습니다.</p><h2>사용처 확인</h2><p>앱의 가맹점 조회 메뉴에서 결제 가능 매장을 확인한 뒤 카드 또는 모바일 방식으로 결제합니다.</p><a class="btn" href="https://www.laiis.go.kr/lips/mlo/lcl/localGiftList.do" target="_blank" rel="noreferrer">대구로페이 사용처 조회 ↗</a></main></html>
